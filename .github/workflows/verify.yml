name: Verify

# Pull requests and main run both jobs once. The jobs are the shared library's workflows; see
# https://github.com/The-Running-Dev/GitHub-ActionTemplates.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  powershell:
    permissions:
      contents: read
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/pwsh-ci.yml@v0
    with:
      tests: tools
      post-build: tools/Test-SpecSet.ps1

  content:
    permissions:
      contents: read
    uses: The-Running-Dev/GitHub-ActionTemplates/.github/workflows/node-ci.yml@v0
    with:
      node-versions: '["24"]'
      # The engine is a pinned submodule and the campaign sources compile against it; `setup`
      # builds it before the install resolves the file: dependency on it.
      submodules: recursive
      setup: setup
      scripts: typecheck test export:content check:clean
