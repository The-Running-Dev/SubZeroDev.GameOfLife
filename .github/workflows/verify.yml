name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Pester
        shell: pwsh
        run: Install-Module -Name Pester -Force -SkipPublisherCheck -Scope CurrentUser

      # verification: true
      - name: Parse-check PowerShell scripts
        shell: pwsh
        run: |
          $parseErrors = Get-ChildItem -Path . -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref] $tokens, [ref] $errors) | Out-Null
            $errors
          }
          if ($parseErrors) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }

      # Kit-owned tools live in the home-installed AgentKit checkout, not this repository.
      # Pin the latest stable runtime so CI has the same immutable boundary as a home install.
      - name: Checkout AgentKit runtime
        uses: actions/checkout@v4
        with:
          repository: The-Running-Dev/SubZeroDev.AgentKit
          ref: fcde2c1a38086518e0d9f2d37a41de6dd857b665
          path: .agent-kit

      # This repository deliberately held its design-state checker before S19 while the
      # closure-budget migration was incomplete (design/90-decisions.md, 2026-08-30). Its
      # retained repository-specific tests therefore run against the recorded synced commit.
      - name: Checkout compatible design-state runtime
        uses: actions/checkout@v4
        with:
          repository: The-Running-Dev/SubZeroDev.AgentKit
          ref: 5095a55c262bad431632e2c9a4d7418b833b3a16
          path: .agent-kit-design-state

      # S21 added Decision.StatedIn after this repository deliberately held its checker before
      # S19. Pull that one upstream schema boundary without activating S19/S20 checker semantics.
      - name: Checkout Decision.StatedIn schema runtime
        uses: actions/checkout@v4
        with:
          repository: The-Running-Dev/SubZeroDev.AgentKit
          ref: 6b32e7d142fabbb9cfc184e19edc9b5345695b39
          path: .agent-kit-stated-in

      # The current design-state records still declare the kit-owned paths removed by #130.
      # Recreate exactly that deleted set from the compatible runtime for this job only, so
      # the checker validates the same tree contract without putting copied tools back in git.
      - name: Materialize the compatible design-state tree
        shell: pwsh
        env:
          DESIGN_STATE_KIT_ROOT: ${{ github.workspace }}/.agent-kit-design-state
          STATED_IN_KIT_ROOT: ${{ github.workspace }}/.agent-kit-stated-in
        run: |
          $removedPaths = git diff-tree --no-commit-id --name-only --diff-filter=D -r d6ab5330473bd0894090dd8cb514fa5944cd4810
          foreach ($path in $removedPaths) {
            $source = Join-Path $env:DESIGN_STATE_KIT_ROOT $path
            if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Compatible AgentKit runtime does not contain '$path'."
            }
            $destination = Join-Path $PWD $path
            New-Item -ItemType Directory -Path (Split-Path $destination -Parent) -Force | Out-Null
            Copy-Item -LiteralPath $source -Destination $destination
          }
          Copy-Item -LiteralPath (Join-Path $env:STATED_IN_KIT_ROOT 'tools/Read-DesignState.ps1') -Destination 'tools/Read-DesignState.ps1'

      # verification: true
      - name: Run Pester tests
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: Invoke-Pester -Path tools -Output Detailed

      # verification: true
      - name: Validate the core/companion split
        shell: pwsh
        env:
          AGENTKIT_HOME: ${{ github.workspace }}/.agent-kit
        run: '& (Join-Path $env:AGENTKIT_HOME ''tools/Test-Companion.ps1'') -TargetRepo .'

      # verification: true
      - name: Check the design state against the tree
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/Test-DesignState.ps1

      # verification: true
      - name: Check the spec set
        shell: pwsh
        run: ./tools/Test-SpecSet.ps1

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The engine is a pinned submodule and the campaign sources compile against it;
          # without this the whole job resolves nothing.
          submodules: recursive

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # verification: true
      - name: Build the pinned engine
        run: npm run setup

      - name: Install content dependencies
        run: npm install

      # verification: true
      - name: Typecheck the campaign sources
        run: npm run typecheck

      # verification: true
      - name: Test the campaign sources
        run: npm test

      # verification: true
      - name: Re-export content and fail if the committed JSON is stale
        run: npm run export:content && npm run check:clean
